// apt config for lapt, read with -c. Paths depend on the root, so lapt passes
// those with -o.
//
// This isn't passed through APT_CONFIG, since maintainer scripts inherit the
// environment, and some (e.g. Warp's) use APT_CONFIG as a variable of their own.

// Drop the host's hooks (needrestart, update-notifier, etc.), which assume
// root. -c is read after apt.conf.d, so these clear what it set.
#clear DPkg::Pre-Invoke;
#clear DPkg::Post-Invoke;
#clear DPkg::Pre-Install-Pkgs;
#clear APT::Update::Pre-Invoke;
#clear APT::Update::Post-Invoke-Success;

// Maintainer scripts failing is routine here (lapt handles it), so don't file
// an apport report about it, which shows up as a crash popup.
Dpkg::ApportFailureReport "false";

// The locks under /var/lib/dpkg belong to the system.
Debug::NoLocking "1";

// Unpack as a normal user, and run maintainer scripts on the host with
// DPKG_ROOT set rather than chrooting into the root.
DPkg::Options { "--force-not-root"; "--force-script-chrootless"; };
